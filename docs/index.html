if" textLength="313.533" lengthAdjust="spacingAndGlyphs">internet, Nexus or Artifactory into immutable znippy archives for air-</text><text x="80" y="148.725" font-size="11" font-family="Libertinus Serif" textLength="318.67" lengthAdjust="spacingAndGlyphs">gapped sites: content-addressed with Blake3, O(1) random file access, 2 </text><text x="80" y="162.783" font-size="11" font-family="Libertinus Serif" textLength="37.994" lengthAdjust="spacingAndGlyphs">MB RSS.</text><text x="80" y="182.671" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="182.671" font-size="11" font-family="Libertinus Serif" textLength="295.273" lengthAdjust="spacingAndGlyphs"> — parallel, random-access archive on Apache Arrow IPC. Packs a </text><text x="80" y="196.729" font-size="11" font-family="Libertinus Serif" textLength="288.189" lengthAdjust="spacingAndGlyphs">directory at all-core speed and pulls any single file back without </text><text x="80" y="210.787" font-size="11" font-family="Libertinus Serif" textLength="323.928" lengthAdjust="spacingAndGlyphs">unpacking the rest; the index is queryable straight from DuckDB, Polars </text><text x="80" y="224.845" font-size="11" font-family="Libertinus Serif" textLength="66" lengthAdjust="spacingAndGlyphs">or DataFusion.</text><text x="80" y="244.733" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="244.733" font-size="11" font-family="Libertinus Serif" textLength="273.328" lengthAdjust="spacingAndGlyphs"> — Git server in Rust on Apache Arrow. Two engines: znippy </text><text x="80" y="258.791" font-size="11" font-family="Libertinus Serif" textLength="325.644" lengthAdjust="spacingAndGlyphs">(Arrow IPC on one machine, or a full Apache Iceberg cluster) or gix on a </text><text x="80" y="272.849" font-size="11" font-family="Libertinus Serif" textLength="334.345" lengthAdjust="spacingAndGlyphs">plain filesystem. Built-in geo-replication to a twin; free to host yourself, or </text><text x="80" y="286.907" font-size="11" font-family="Libertinus Serif" textLength="88.748" lengthAdjust="spacingAndGlyphs">hosted at gunnar.rs.</text><text x="24" y="306.795" font-size="11" font-family="Libertinus Serif" textLength="40.645" lengthAdjust="spacingAndGlyphs">Contact: </text><text x="64.645" y="306.795" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="110.104" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="172.166" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="234.228" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="64.645" y="296.147" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>

gth="32.263" lengthAdjust="spacingAndGlyphs">holger</text><text x="112.263" y="120.609" font-size="11" font-family="Libertinus Serif" textLength="96.558" lengthAdjust="spacingAndGlyphs"> — immutable artifact </text><text x="80" y="134.667" font-size="11" font-family="Libertinus Serif" textLength="167.992" lengthAdjust="spacingAndGlyphs">repository in pure Rust. Mirrors from </text><text x="80" y="148.725" font-size="11" font-family="Libertinus Serif" textLength="172.194" lengthAdjust="spacingAndGlyphs">the internet, Nexus or Artifactory into </text><text x="80" y="162.783" font-size="11" font-family="Libertinus Serif" textLength="155.65" lengthAdjust="spacingAndGlyphs">immutable znippy archives for air-</text><text x="80" y="176.841" font-size="11" font-family="Libertinus Serif" textLength="165.957" lengthAdjust="spacingAndGlyphs">gapped sites: content-addressed with </text><text x="80" y="190.899" font-size="11" font-family="Libertinus Serif" textLength="168.41" lengthAdjust="spacingAndGlyphs">Blake3, O(1) random file access, 2 MB </text><text x="80" y="204.957" font-size="11" font-family="Libertinus Serif" textLength="19.547" lengthAdjust="spacingAndGlyphs">RSS.</text><text x="80" y="224.845" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="224.845" font-size="11" font-family="Libertinus Serif" textLength="118.855" lengthAdjust="spacingAndGlyphs"> — parallel, random-access </text><text x="80" y="238.903" font-size="11" font-family="Libertinus Serif" textLength="173.668" lengthAdjust="spacingAndGlyphs">archive on Apache Arrow IPC. Packs a </text><text x="80" y="252.961" font-size="11" font-family="Libertinus Serif" textLength="161.007" lengthAdjust="spacingAndGlyphs">directory at all-core speed and pulls </text><text x="80" y="267.019" font-size="11" font-family="Libertinus Serif" textLength="174.504" lengthAdjust="spacingAndGlyphs">any single file back without unpacking </text><text x="80" y="281.077" font-size="11" font-family="Libertinus Serif" textLength="175.659" lengthAdjust="spacingAndGlyphs">the rest; the index is queryable straight </text><text x="80" y="295.135" font-size="11" font-family="Libertinus Serif" textLength="164.197" lengthAdjust="spacingAndGlyphs">from DuckDB, Polars or DataFusion.</text><text x="80" y="315.023" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="315.023" font-size="11" font-family="Libertinus Serif" textLength="107.019" lengthAdjust="spacingAndGlyphs"> — Git server in Rust on </text><text x="80" y="329.081" font-size="11" font-family="Libertinus Serif" textLength="163.559" lengthAdjust="spacingAndGlyphs">Apache Arrow. Two engines: znippy </text><text x="80" y="343.139" font-size="11" font-family="Libertinus Serif" textLength="166.177" lengthAdjust="spacingAndGlyphs">(Arrow IPC on one machine, or a full </text><text x="80" y="357.197" font-size="11" font-family="Libertinus Serif" textLength="156.717" lengthAdjust="spacingAndGlyphs">Apache Iceberg cluster) or gix on a </text><text x="80" y="371.255" font-size="11" font-family="Libertinus Serif" textLength="132.649" lengthAdjust="spacingAndGlyphs">plain filesystem. Built-in geo-</text><text x="80" y="385.313" font-size="11" font-family="Libertinus Serif" textLength="147.565" lengthAdjust="spacingAndGlyphs">replication to a twin; free to host </text><text x="80" y="399.371" font-size="11" font-family="Libertinus Serif" textLength="142.879" lengthAdjust="spacingAndGlyphs">yourself, or hosted at gunnar.rs.</text><text x="24" y="419.259" font-size="11" font-family="Libertinus Serif" textLength="40.645" lengthAdjust="spacingAndGlyphs">Contact: </text><text x="64.645" y="419.259" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="110.104" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="214.34" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="304.518" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="64.645" y="408.611" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>
