947 c 0.33 0.341 0.803 0.44 0.99 0.44 c 0.396 0 0.715 -0.275 0.715 -0.693 Z "/></symbol></defs></g><g class="text-layer"><text x="24" y="36.9" font-size="20" font-family="Libertinus Serif" textLength="117.08" lengthAdjust="spacingAndGlyphs">Ignalina ApS</text><text x="24" y="58.138" font-size="11" font-family="Libertinus Serif" textLength="223.993" lengthAdjust="spacingAndGlyphs">"We love the smell of motherboards in the morning"</text><text x="247.993" y="58.138" font-size="11" font-family="Libertinus Serif" textLength="121.418" lengthAdjust="spacingAndGlyphs"> — og vi laver udelukkende </text><text x="24" y="72.196" font-size="11" font-family="Libertinus Serif" textLength="389.235" lengthAdjust="spacingAndGlyphs">premium-software. Vi er en rent skandinavisk virksomhed. Vores applikationer leveres </text><text x="24" y="86.254" font-size="11" font-family="Libertinus Serif" textLength="256.465" lengthAdjust="spacingAndGlyphs">som open source, som SaaS og som hardware-appliances.</text><text x="24" y="105.999" font-size="11" font-family="Libertinus Serif" textLength="232.606" lengthAdjust="spacingAndGlyphs">Vores SaaS-løsninger kører på finsk atomkraft.</text><text x="24" y="136.674" font-size="15" font-family="Libertinus Serif" textLength="69.585" lengthAdjust="spacingAndGlyphs">Produkter</text><text x="80" y="154.412" font-size="11" font-family="Libertinus Serif" textLength="32.263" lengthAdjust="spacingAndGlyphs">holger</text><text x="112.263" y="154.412" font-size="11" font-family="Libertinus Serif" textLength="296.164" lengthAdjust="spacingAndGlyphs"> — immutable artifact repository i ren Rust. Spejler fra internettet, </text><text x="80" y="168.47" font-size="11" font-family="Libertinus Serif" textLength="311.641" lengthAdjust="spacingAndGlyphs">Nexus eller Artifactory til uforanderlige znippy-arkiver til air-gapped </text><text x="80" y="182.528" font-size="11" font-family="Libertinus Serif" textLength="328.163" lengthAdjust="spacingAndGlyphs">miljøer: content-addressed med Blake3, O(1) random access til filer, 2 MB </text><text x="80" y="196.586" font-size="11" font-family="Libertinus Serif" textLength="19.547" lengthAdjust="spacingAndGlyphs">RSS.</text><text x="80" y="216.474" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="216.474" font-size="11" font-family="Libertinus Serif" textLength="284.878" lengthAdjust="spacingAndGlyphs"> — parallelt arkiv med random access, bygget på Apache Arrow </text><text x="80" y="230.532" font-size="11" font-family="Libertinus Serif" textLength="326.656" lengthAdjust="spacingAndGlyphs">IPC. Pakker en mappe med fuld fart på alle kerner og henter en enkelt fil </text><text x="80" y="244.59" font-size="11" font-family="Libertinus Serif" textLength="332.024" lengthAdjust="spacingAndGlyphs">ud uden at pakke resten ud; indekset kan forespørges direkte fra DuckDB, </text><text x="80" y="258.648" font-size="11" font-family="Libertinus Serif" textLength="106.656" lengthAdjust="spacingAndGlyphs">Polars eller DataFusion.</text><text x="80" y="278.536" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="278.536" font-size="11" font-family="Libertinus Serif" textLength="296.208" lengthAdjust="spacingAndGlyphs"> — Git-server i Rust på Apache Arrow. To motorer: znippy (Arrow </text><text x="80" y="292.594" font-size="11" font-family="Libertinus Serif" textLength="313.94" lengthAdjust="spacingAndGlyphs">IPC på én maskine eller en fuld Apache Iceberg-klynge) eller gix på et </text><text x="80" y="306.652" font-size="11" font-family="Libertinus Serif" textLength="334.587" lengthAdjust="spacingAndGlyphs">almindeligt filsystem. Indbygget geo-replikering til en twin; gratis at hoste </text><text x="80" y="320.71" font-size="11" font-family="Libertinus Serif" textLength="133.397" lengthAdjust="spacingAndGlyphs">selv, eller hostet på gunnar.rs.</text><text x="80" y="340.598" font-size="11" font-family="Libertinus Serif" textLength="28.556" lengthAdjust="spacingAndGlyphs">skade</text><text x="108.556" y="340.598" font-size="11" font-family="Libertinus Serif" textLength="301.037" lengthAdjust="spacingAndGlyphs"> — Apache Iceberg i ren Rust. Kataloget hviler på et statisk søgetræ </text><text x="80" y="354.656" font-size="11" font-family="Libertinus Serif" textLength="303.633" lengthAdjust="spacingAndGlyphs">med opslag på nanosekunder og kan indlejres in-process som én fil; </text><text x="80" y="368.714" font-size="11" font-family="Libertinus Serif" textLength="283.668" lengthAdjust="spacingAndGlyphs">katalog-læsninger målt til 492× Nessie og 677× Polaris. SQL via </text><text x="80" y="382.772" font-size="11" font-family="Libertinus Serif" textLength="53.614" lengthAdjust="spacingAndGlyphs">DataFusion.</text><text x="80" y="402.66" font-size="11" font-family="Libertinus Serif" textLength="23.903" lengthAdjust="spacingAndGlyphs">korp</text><text x="103.903" y="402.66" font-size="11" font-family="Libertinus Serif" textLength="299.365" lengthAdjust="spacingAndGlyphs"> — én robot-testbar egui-app over hele datavejen. Hugin holder øje </text><text x="80" y="416.718" font-size="11" font-family="Libertinus Serif" textLength="315.876" lengthAdjust="spacingAndGlyphs">med nuet: Spark-pipelines, en live FalkorDB-graf, ingest. Munin bærer </text><text x="80" y="430.776" font-size="11" font-family="Libertinus Serif" textLength="329.439" lengthAdjust="spacingAndGlyphs">hukommelsen: Iceberg time-travel, kort, efterforskninger. Leveres som en </text><text x="80" y="444.834" font-size="11" font-family="Libertinus Serif" textLength="82.72" lengthAdjust="spacingAndGlyphs">bootbar appliance.</text><text x="80" y="464.722" font-size="11" font-family="Libertinus Serif" textLength="28.776" lengthAdjust="spacingAndGlyphs">tunnr</text><text x="108.776" y="464.722" font-size="11" font-family="Libertinus Serif" textLength="290.774" lengthAdjust="spacingAndGlyphs"> — framework til bare-metal appliances. Minimale, distroless OS-</text><text x="80" y="478.78" font-size="11" font-family="Libertinus Serif" textLength="323.499" lengthAdjust="spacingAndGlyphs">images, hvor en Rust-binær kører som PID 1, network-first: WireGuard-</text><text x="80" y="492.838" font-size="11" font-family="Libertinus Serif" textLength="334.499" lengthAdjust="spacingAndGlyphs">tunnelen er oppe før nogen anden pakke, i en VM eller på rigtig hardware.</text><text x="24" y="521.372" font-size="11" font-family="Libertinus Serif" textLength="41.25" lengthAdjust="spacingAndGlyphs">Kontakt: </text><text x="65.25" y="521.372" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="143.907" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="205.969" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="268.031" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/skade" xlink:href="https://codeberg.org/nordisk/skade"><rect x="80" y="330.093" width="28.556" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="65.25" y="510.724" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>

" lengthAdjust="spacingAndGlyphs">og som hardware-appliances.</text><text x="24" y="133.972" font-size="11" font-family="Libertinus Serif" textLength="177.067" lengthAdjust="spacingAndGlyphs">Vores SaaS-løsninger kører på finsk </text><text x="24" y="147.887" font-size="11" font-family="Libertinus Serif" textLength="52.789" lengthAdjust="spacingAndGlyphs">atomkraft.</text><text x="24" y="178.562" font-size="15" font-family="Libertinus Serif" textLength="69.585" lengthAdjust="spacingAndGlyphs">Produkter</text><text x="80" y="196.3" font-size="11" font-family="Libertinus Serif" textLength="32.263" lengthAdjust="spacingAndGlyphs">holger</text><text x="112.263" y="196.3" font-size="11" font-family="Libertinus Serif" textLength="96.558" lengthAdjust="spacingAndGlyphs"> — immutable artifact </text><text x="80" y="210.358" font-size="11" font-family="Libertinus Serif" textLength="144.034" lengthAdjust="spacingAndGlyphs">repository i ren Rust. Spejler fra </text><text x="80" y="224.416" font-size="11" font-family="Libertinus Serif" textLength="168.498" lengthAdjust="spacingAndGlyphs">internettet, Nexus eller Artifactory til </text><text x="80" y="238.474" font-size="11" font-family="Libertinus Serif" textLength="160.633" lengthAdjust="spacingAndGlyphs">uforanderlige znippy-arkiver til air-</text><text x="80" y="252.532" font-size="11" font-family="Libertinus Serif" textLength="154.781" lengthAdjust="spacingAndGlyphs">gapped miljøer: content-addressed </text><text x="80" y="266.59" font-size="11" font-family="Libertinus Serif" textLength="157.058" lengthAdjust="spacingAndGlyphs">med Blake3, O(1) random access til </text><text x="80" y="280.648" font-size="11" font-family="Libertinus Serif" textLength="68.453" lengthAdjust="spacingAndGlyphs">filer, 2 MB RSS.</text><text x="80" y="300.536" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="300.536" font-size="11" font-family="Libertinus Serif" textLength="136.202" lengthAdjust="spacingAndGlyphs"> — parallelt arkiv med random </text><text x="80" y="314.594" font-size="11" font-family="Libertinus Serif" textLength="167.42" lengthAdjust="spacingAndGlyphs">access, bygget på Apache Arrow IPC. </text><text x="80" y="328.652" font-size="11" font-family="Libertinus Serif" textLength="170.973" lengthAdjust="spacingAndGlyphs">Pakker en mappe med fuld fart på alle </text><text x="80" y="342.71" font-size="11" font-family="Libertinus Serif" textLength="170.632" lengthAdjust="spacingAndGlyphs">kerner og henter en enkelt fil ud uden </text><text x="80" y="356.768" font-size="11" font-family="Libertinus Serif" textLength="145.101" lengthAdjust="spacingAndGlyphs">at pakke resten ud; indekset kan </text><text x="80" y="370.826" font-size="11" font-family="Libertinus Serif" textLength="175.538" lengthAdjust="spacingAndGlyphs">forespørges direkte fra DuckDB, Polars </text><text x="80" y="384.884" font-size="11" font-family="Libertinus Serif" textLength="76.098" lengthAdjust="spacingAndGlyphs">eller DataFusion.</text><text x="80" y="404.772" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="404.772" font-size="11" font-family="Libertinus Serif" textLength="137.929" lengthAdjust="spacingAndGlyphs"> — Git-server i Rust på Apache </text><text x="80" y="418.83" font-size="11" font-family="Libertinus Serif" textLength="174.603" lengthAdjust="spacingAndGlyphs">Arrow. To motorer: znippy (Arrow IPC </text><text x="80" y="432.888" font-size="11" font-family="Libertinus Serif" textLength="157.872" lengthAdjust="spacingAndGlyphs">på én maskine eller en fuld Apache </text><text x="80" y="446.946" font-size="11" font-family="Libertinus Serif" textLength="134.244" lengthAdjust="spacingAndGlyphs">Iceberg-klynge) eller gix på et </text><text x="80" y="461.004" font-size="11" font-family="Libertinus Serif" textLength="167.002" lengthAdjust="spacingAndGlyphs">almindeligt filsystem. Indbygget geo-</text><text x="80" y="475.062" font-size="11" font-family="Libertinus Serif" textLength="167.585" lengthAdjust="spacingAndGlyphs">replikering til en twin; gratis at hoste </text><text x="80" y="489.12" font-size="11" font-family="Libertinus Serif" textLength="133.397" lengthAdjust="spacingAndGlyphs">selv, eller hostet på gunnar.rs.</text><text x="80" y="509.008" font-size="11" font-family="Libertinus Serif" textLength="28.556" lengthAdjust="spacingAndGlyphs">skade</text><text x="108.556" y="509.008" font-size="11" font-family="Libertinus Serif" textLength="131.868" lengthAdjust="spacingAndGlyphs"> — Apache Iceberg i ren Rust. </text><text x="80" y="523.066" font-size="11" font-family="Libertinus Serif" textLength="166.419" lengthAdjust="spacingAndGlyphs">Kataloget hviler på et statisk søgetræ </text><text x="80" y="537.124" font-size="11" font-family="Libertinus Serif" textLength="164.087" lengthAdjust="spacingAndGlyphs">med opslag på nanosekunder og kan </text><text x="80" y="551.182" font-size="11" font-family="Libertinus Serif" textLength="136.796" lengthAdjust="spacingAndGlyphs">indlejres in-process som én fil; </text><text x="80" y="565.24" font-size="11" font-family="Libertinus Serif" textLength="171.93" lengthAdjust="spacingAndGlyphs">katalog-læsninger målt til 492× Nessie </text><text x="80" y="579.298" font-size="11" font-family="Libertinus Serif" textLength="165.352" lengthAdjust="spacingAndGlyphs">og 677× Polaris. SQL via DataFusion.</text><text x="80" y="599.186" font-size="11" font-family="Libertinus Serif" textLength="23.903" lengthAdjust="spacingAndGlyphs">korp</text><text x="103.903" y="599.186" font-size="11" font-family="Libertinus Serif" textLength="150.568" lengthAdjust="spacingAndGlyphs"> — én robot-testbar egui-app over </text><text x="80" y="613.244" font-size="11" font-family="Libertinus Serif" textLength="168.047" lengthAdjust="spacingAndGlyphs">hele datavejen. Hugin holder øje med </text><text x="80" y="627.302" font-size="11" font-family="Libertinus Serif" textLength="130.482" lengthAdjust="spacingAndGlyphs">nuet: Spark-pipelines, en live </text><text x="80" y="641.36" font-size="11" font-family="Libertinus Serif" textLength="160.644" lengthAdjust="spacingAndGlyphs">FalkorDB-graf, ingest. Munin bærer </text><text x="80" y="655.418" font-size="11" font-family="Libertinus Serif" textLength="156.332" lengthAdjust="spacingAndGlyphs">hukommelsen: Iceberg time-travel, </text><text x="80" y="669.476" font-size="11" font-family="Libertinus Serif" textLength="170.357" lengthAdjust="spacingAndGlyphs">kort, efterforskninger. Leveres som en </text><text x="80" y="683.534" font-size="11" font-family="Libertinus Serif" textLength="82.72" lengthAdjust="spacingAndGlyphs">bootbar appliance.</text><text x="80" y="703.422" font-size="11" font-family="Libertinus Serif" textLength="28.776" lengthAdjust="spacingAndGlyphs">tunnr</text><text x="108.776" y="703.422" font-size="11" font-family="Libertinus Serif" textLength="126.082" lengthAdjust="spacingAndGlyphs"> — framework til bare-metal </text><text x="80" y="717.48" font-size="11" font-family="Libertinus Serif" textLength="161.942" lengthAdjust="spacingAndGlyphs">appliances. Minimale, distroless OS-</text><text x="80" y="731.538" font-size="11" font-family="Libertinus Serif" textLength="171.897" lengthAdjust="spacingAndGlyphs">images, hvor en Rust-binær kører som </text><text x="80" y="745.596" font-size="11" font-family="Libertinus Serif" textLength="148.852" lengthAdjust="spacingAndGlyphs">PID 1, network-first: WireGuard-</text><text x="80" y="759.654" font-size="11" font-family="Libertinus Serif" textLength="153.021" lengthAdjust="spacingAndGlyphs">tunnelen er oppe før nogen anden </text><text x="80" y="773.712" font-size="11" font-family="Libertinus Serif" textLength="130.988" lengthAdjust="spacingAndGlyphs">pakke, i en VM eller på rigtig </text><text x="80" y="787.77" font-size="11" font-family="Libertinus Serif" textLength="44.99" lengthAdjust="spacingAndGlyphs">hardware.</text><text x="24" y="807.658" font-size="11" font-family="Libertinus Serif" textLength="41.25" lengthAdjust="spacingAndGlyphs">Kontakt: </text><text x="65.25" y="807.658" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="185.795" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="290.031" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="394.267" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/skade" xlink:href="https://codeberg.org/nordisk/skade"><rect x="80" y="498.503" width="28.556" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="65.25" y="797.01" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>
