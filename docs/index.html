0.022 0 -0.121 0.022 -0.121 0.132 Z m -0.154 2.662 c 0 -0.374 -0.187 -0.935 -0.33 -1.276 c -0.341 -0.803 -0.88 -1.43 -1.265 -1.43 c -0.693 0 -0.858 0.484 -0.858 1.012 c 0 0.682 0.187 1.386 0.748 1.947 c 0.33 0.341 0.803 0.44 0.99 0.44 c 0.396 0 0.715 -0.275 0.715 -0.693 Z "/></symbol></defs></g><g class="text-layer"><text x="24" y="36.9" font-size="20" font-family="Libertinus Serif" textLength="117.08" lengthAdjust="spacingAndGlyphs">Ignalina ApS</text><text x="24" y="58.138" font-size="11" font-family="Libertinus Serif" textLength="377.267" lengthAdjust="spacingAndGlyphs">We love the smell of motherboards in the morning, and we do nothing but premium </text><text x="24" y="72.196" font-size="11" font-family="Libertinus Serif" textLength="365.167" lengthAdjust="spacingAndGlyphs">software. Our applications are delivered as open source, as SaaS, and as hardware </text><text x="24" y="86.254" font-size="11" font-family="Libertinus Serif" textLength="49.654" lengthAdjust="spacingAndGlyphs">appliances.</text><text x="24" y="116.929" font-size="15" font-family="Libertinus Serif" textLength="59.88" lengthAdjust="spacingAndGlyphs">Products</text><text x="80" y="134.667" font-size="11" font-family="Libertinus Serif" textLength="32.263" lengthAdjust="spacingAndGlyphs">holger</text><text x="112.263" y="134.667" font-size="11" font-family="Libertinus Serif" textLength="284.361" lengthAdjust="spacingAndGlyphs"> — immutable artifact repository in pure Rust. Mirrors from the </text><text x="80" y="148.725" font-size="11" font-family="Libertinus Serif" textLength="313.533" lengthAdjust="spacingAndGlyphs">internet, Nexus or Artifactory into immutable znippy archives for air-</text><text x="80" y="162.783" font-size="11" font-family="Libertinus Serif" textLength="318.67" lengthAdjust="spacingAndGlyphs">gapped sites: content-addressed with Blake3, O(1) random file access, 2 </text><text x="80" y="176.841" font-size="11" font-family="Libertinus Serif" textLength="37.994" lengthAdjust="spacingAndGlyphs">MB RSS.</text><text x="80" y="196.729" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="196.729" font-size="11" font-family="Libertinus Serif" textLength="295.273" lengthAdjust="spacingAndGlyphs"> — parallel, random-access archive on Apache Arrow IPC. Packs a </text><text x="80" y="210.787" font-size="11" font-family="Libertinus Serif" textLength="288.189" lengthAdjust="spacingAndGlyphs">directory at all-core speed and pulls any single file back without </text><text x="80" y="224.845" font-size="11" font-family="Libertinus Serif" textLength="323.928" lengthAdjust="spacingAndGlyphs">unpacking the rest; the index is queryable straight from DuckDB, Polars </text><text x="80" y="238.903" font-size="11" font-family="Libertinus Serif" textLength="66" lengthAdjust="spacingAndGlyphs">or DataFusion.</text><text x="80" y="258.791" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="258.791" font-size="11" font-family="Libertinus Serif" textLength="273.328" lengthAdjust="spacingAndGlyphs"> — Git server in Rust on Apache Arrow. Two engines: znippy </text><text x="80" y="272.849" font-size="11" font-family="Libertinus Serif" textLength="325.644" lengthAdjust="spacingAndGlyphs">(Arrow IPC on one machine, or a full Apache Iceberg cluster) or gix on a </text><text x="80" y="286.907" font-size="11" font-family="Libertinus Serif" textLength="334.345" lengthAdjust="spacingAndGlyphs">plain filesystem. Built-in geo-replication to a twin; free to host yourself, or </text><text x="80" y="300.965" font-size="11" font-family="Libertinus Serif" textLength="88.748" lengthAdjust="spacingAndGlyphs">hosted at gunnar.rs.</text><text x="80" y="320.853" font-size="11" font-family="Libertinus Serif" textLength="28.556" lengthAdjust="spacingAndGlyphs">skade</text><text x="108.556" y="320.853" font-size="11" font-family="Libertinus Serif" textLength="291.863" lengthAdjust="spacingAndGlyphs"> — pure-Rust Apache Iceberg. The catalog rests on a static search </text><text x="80" y="334.911" font-size="11" font-family="Libertinus Serif" textLength="328.251" lengthAdjust="spacingAndGlyphs">tree with nanosecond lookups, and embeds in-process as one file; catalog </text><text x="80" y="348.969" font-size="11" font-family="Libertinus Serif" textLength="333.454" lengthAdjust="spacingAndGlyphs">reads measured at 492× Nessie and 677× Polaris. SQL through DataFusion.</text><text x="80" y="377.503" font-size="11" font-family="Libertinus Serif" textLength="23.903" lengthAdjust="spacingAndGlyphs">korp</text><text x="103.903" y="377.503" font-size="11" font-family="Libertinus Serif" textLength="284.394" lengthAdjust="spacingAndGlyphs"> — one robot-testable egui app over the whole data path. Hugin </text><text x="80" y="391.561" font-size="11" font-family="Libertinus Serif" textLength="332.607" lengthAdjust="spacingAndGlyphs">watches now: Spark pipelines, a live FalkorDB graph, ingest. Munin keeps </text><text x="80" y="405.619" font-size="11" font-family="Libertinus Serif" textLength="332.695" lengthAdjust="spacingAndGlyphs">the memory: Iceberg time-travel, maps, investigations. Ships as a bootable </text><text x="80" y="419.677" font-size="11" font-family="Libertinus Serif" textLength="45.254" lengthAdjust="spacingAndGlyphs">appliance.</text><text x="80" y="439.565" font-size="11" font-family="Libertinus Serif" textLength="28.776" lengthAdjust="spacingAndGlyphs">tunnr</text><text x="108.776" y="439.565" font-size="11" font-family="Libertinus Serif" textLength="300.003" lengthAdjust="spacingAndGlyphs"> — bare-metal appliance framework. Minimal, distroless OS images </text><text x="80" y="453.623" font-size="11" font-family="Libertinus Serif" textLength="332.409" lengthAdjust="spacingAndGlyphs">where a Rust binary runs as PID 1, network-first: the WireGuard tunnel is </text><text x="80" y="467.681" font-size="11" font-family="Libertinus Serif" textLength="255.97" lengthAdjust="spacingAndGlyphs">up before any other packet, in a VM or on real hardware.</text><text x="24" y="496.215" font-size="11" font-family="Libertinus Serif" textLength="40.645" lengthAdjust="spacingAndGlyphs">Contact: </text><text x="64.645" y="496.215" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="124.162" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="186.224" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="248.286" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/skade" xlink:href="https://codeberg.org/nordisk/skade"><rect x="80" y="310.348" width="28.556" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="64.645" y="485.567" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>

cingAndGlyphs">Products</text><text x="80" y="148.725" font-size="11" font-family="Libertinus Serif" textLength="32.263" lengthAdjust="spacingAndGlyphs">holger</text><text x="112.263" y="148.725" font-size="11" font-family="Libertinus Serif" textLength="96.558" lengthAdjust="spacingAndGlyphs"> — immutable artifact </text><text x="80" y="162.783" font-size="11" font-family="Libertinus Serif" textLength="167.992" lengthAdjust="spacingAndGlyphs">repository in pure Rust. Mirrors from </text><text x="80" y="176.841" font-size="11" font-family="Libertinus Serif" textLength="172.194" lengthAdjust="spacingAndGlyphs">the internet, Nexus or Artifactory into </text><text x="80" y="190.899" font-size="11" font-family="Libertinus Serif" textLength="155.65" lengthAdjust="spacingAndGlyphs">immutable znippy archives for air-</text><text x="80" y="204.957" font-size="11" font-family="Libertinus Serif" textLength="165.957" lengthAdjust="spacingAndGlyphs">gapped sites: content-addressed with </text><text x="80" y="219.015" font-size="11" font-family="Libertinus Serif" textLength="168.41" lengthAdjust="spacingAndGlyphs">Blake3, O(1) random file access, 2 MB </text><text x="80" y="233.073" font-size="11" font-family="Libertinus Serif" textLength="19.547" lengthAdjust="spacingAndGlyphs">RSS.</text><text x="80" y="252.961" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="252.961" font-size="11" font-family="Libertinus Serif" textLength="118.855" lengthAdjust="spacingAndGlyphs"> — parallel, random-access </text><text x="80" y="267.019" font-size="11" font-family="Libertinus Serif" textLength="173.668" lengthAdjust="spacingAndGlyphs">archive on Apache Arrow IPC. Packs a </text><text x="80" y="281.077" font-size="11" font-family="Libertinus Serif" textLength="161.007" lengthAdjust="spacingAndGlyphs">directory at all-core speed and pulls </text><text x="80" y="295.135" font-size="11" font-family="Libertinus Serif" textLength="174.504" lengthAdjust="spacingAndGlyphs">any single file back without unpacking </text><text x="80" y="309.193" font-size="11" font-family="Libertinus Serif" textLength="175.659" lengthAdjust="spacingAndGlyphs">the rest; the index is queryable straight </text><text x="80" y="323.251" font-size="11" font-family="Libertinus Serif" textLength="164.197" lengthAdjust="spacingAndGlyphs">from DuckDB, Polars or DataFusion.</text><text x="80" y="343.139" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="343.139" font-size="11" font-family="Libertinus Serif" textLength="107.019" lengthAdjust="spacingAndGlyphs"> — Git server in Rust on </text><text x="80" y="357.197" font-size="11" font-family="Libertinus Serif" textLength="163.559" lengthAdjust="spacingAndGlyphs">Apache Arrow. Two engines: znippy </text><text x="80" y="371.255" font-size="11" font-family="Libertinus Serif" textLength="166.177" lengthAdjust="spacingAndGlyphs">(Arrow IPC on one machine, or a full </text><text x="80" y="385.313" font-size="11" font-family="Libertinus Serif" textLength="156.717" lengthAdjust="spacingAndGlyphs">Apache Iceberg cluster) or gix on a </text><text x="80" y="399.371" font-size="11" font-family="Libertinus Serif" textLength="132.649" lengthAdjust="spacingAndGlyphs">plain filesystem. Built-in geo-</text><text x="80" y="413.429" font-size="11" font-family="Libertinus Serif" textLength="147.565" lengthAdjust="spacingAndGlyphs">replication to a twin; free to host </text><text x="80" y="427.487" font-size="11" font-family="Libertinus Serif" textLength="142.879" lengthAdjust="spacingAndGlyphs">yourself, or hosted at gunnar.rs.</text><text x="80" y="447.375" font-size="11" font-family="Libertinus Serif" textLength="28.556" lengthAdjust="spacingAndGlyphs">skade</text><text x="108.556" y="447.375" font-size="11" font-family="Libertinus Serif" textLength="132.693" lengthAdjust="spacingAndGlyphs"> — pure-Rust Apache Iceberg. </text><text x="80" y="461.433" font-size="11" font-family="Libertinus Serif" textLength="156.42" lengthAdjust="spacingAndGlyphs">The catalog rests on a static search </text><text x="80" y="475.491" font-size="11" font-family="Libertinus Serif" textLength="157.058" lengthAdjust="spacingAndGlyphs">tree with nanosecond lookups, and </text><text x="80" y="489.549" font-size="11" font-family="Libertinus Serif" textLength="168.443" lengthAdjust="spacingAndGlyphs">embeds in-process as one file; catalog </text><text x="80" y="503.607" font-size="11" font-family="Libertinus Serif" textLength="156.42" lengthAdjust="spacingAndGlyphs">reads measured at 492× Nessie and </text><text x="80" y="517.665" font-size="11" font-family="Libertinus Serif" textLength="174.284" lengthAdjust="spacingAndGlyphs">677× Polaris. SQL through DataFusion.</text><text x="80" y="537.553" font-size="11" font-family="Libertinus Serif" textLength="23.903" lengthAdjust="spacingAndGlyphs">korp</text><text x="103.903" y="537.553" font-size="11" font-family="Libertinus Serif" textLength="136.268" lengthAdjust="spacingAndGlyphs"> — one robot-testable egui app </text><text x="80" y="551.611" font-size="11" font-family="Libertinus Serif" textLength="145.376" lengthAdjust="spacingAndGlyphs">over the whole data path. Hugin </text><text x="80" y="565.669" font-size="11" font-family="Libertinus Serif" textLength="162.415" lengthAdjust="spacingAndGlyphs">watches now: Spark pipelines, a live </text><text x="80" y="579.727" font-size="11" font-family="Libertinus Serif" textLength="167.442" lengthAdjust="spacingAndGlyphs">FalkorDB graph, ingest. Munin keeps </text><text x="80" y="593.785" font-size="11" font-family="Libertinus Serif" textLength="147.851" lengthAdjust="spacingAndGlyphs">the memory: Iceberg time-travel, </text><text x="80" y="607.843" font-size="11" font-family="Libertinus Serif" textLength="140.899" lengthAdjust="spacingAndGlyphs">maps, investigations. Ships as a </text><text x="80" y="621.901" font-size="11" font-family="Libertinus Serif" textLength="86.449" lengthAdjust="spacingAndGlyphs">bootable appliance.</text><text x="80" y="641.789" font-size="11" font-family="Libertinus Serif" textLength="28.776" lengthAdjust="spacingAndGlyphs">tunnr</text><text x="108.776" y="641.789" font-size="11" font-family="Libertinus Serif" textLength="107.459" lengthAdjust="spacingAndGlyphs"> — bare-metal appliance </text><text x="80" y="655.847" font-size="11" font-family="Libertinus Serif" textLength="155.639" lengthAdjust="spacingAndGlyphs">framework. Minimal, distroless OS </text><text x="80" y="669.905" font-size="11" font-family="Libertinus Serif" textLength="159.786" lengthAdjust="spacingAndGlyphs">images where a Rust binary runs as </text><text x="80" y="683.963" font-size="11" font-family="Libertinus Serif" textLength="162.195" lengthAdjust="spacingAndGlyphs">PID 1, network-first: the WireGuard </text><text x="80" y="698.021" font-size="11" font-family="Libertinus Serif" textLength="165.198" lengthAdjust="spacingAndGlyphs">tunnel is up before any other packet, </text><text x="80" y="712.079" font-size="11" font-family="Libertinus Serif" textLength="129.855" lengthAdjust="spacingAndGlyphs">in a VM or on real hardware.</text><text x="24" y="731.967" font-size="11" font-family="Libertinus Serif" textLength="40.645" lengthAdjust="spacingAndGlyphs">Contact: </text><text x="64.645" y="731.967" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="138.22" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="242.456" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="332.634" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/skade" xlink:href="https://codeberg.org/nordisk/skade"><rect x="80" y="436.87" width="28.556" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="64.645" y="721.319" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>
