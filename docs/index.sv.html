187 1.386 0.748 1.947 c 0.33 0.341 0.803 0.44 0.99 0.44 c 0.396 0 0.715 -0.275 0.715 -0.693 Z "/></symbol></defs></g><g class="text-layer"><text x="24" y="36.9" font-size="20" font-family="Libertinus Serif" textLength="117.08" lengthAdjust="spacingAndGlyphs">Ignalina ApS</text><text x="24" y="58.138" font-size="11" font-family="Libertinus Serif" textLength="223.993" lengthAdjust="spacingAndGlyphs">"We love the smell of motherboards in the morning"</text><text x="247.993" y="58.138" font-size="11" font-family="Libertinus Serif" textLength="146.927" lengthAdjust="spacingAndGlyphs"> — och vi gör ingenting annat än </text><text x="24" y="72.196" font-size="11" font-family="Libertinus Serif" textLength="354.706" lengthAdjust="spacingAndGlyphs">premiummjukvara. Vi är ett renodlat skandinaviskt företag. Våra applikationer </text><text x="24" y="86.254" font-size="11" font-family="Libertinus Serif" textLength="303.05" lengthAdjust="spacingAndGlyphs">levereras som open source, som SaaS och som hårdvaru-appliances.</text><text x="24" y="105.999" font-size="11" font-family="Libertinus Serif" textLength="221.375" lengthAdjust="spacingAndGlyphs">Våra SaaS-lösningar körs på finsk kärnkraft.</text><text x="24" y="136.674" font-size="15" font-family="Libertinus Serif" textLength="69.585" lengthAdjust="spacingAndGlyphs">Produkter</text><text x="80" y="154.412" font-size="11" font-family="Libertinus Serif" textLength="32.263" lengthAdjust="spacingAndGlyphs">holger</text><text x="112.263" y="154.412" font-size="11" font-family="Libertinus Serif" textLength="292.875" lengthAdjust="spacingAndGlyphs"> — immutable artifact repository i ren Rust. Speglar från internet, </text><text x="80" y="168.47" font-size="11" font-family="Libertinus Serif" textLength="314.391" lengthAdjust="spacingAndGlyphs">Nexus eller Artifactory till oföränderliga znippy-arkiv för air-gappade </text><text x="80" y="182.528" font-size="11" font-family="Libertinus Serif" textLength="331.144" lengthAdjust="spacingAndGlyphs">miljöer: content-addressed med Blake3, O(1) random access till filer, 2 MB </text><text x="80" y="196.586" font-size="11" font-family="Libertinus Serif" textLength="19.547" lengthAdjust="spacingAndGlyphs">RSS.</text><text x="80" y="216.474" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="216.474" font-size="11" font-family="Libertinus Serif" textLength="282.865" lengthAdjust="spacingAndGlyphs"> — parallellt arkiv med random access, byggt på Apache Arrow </text><text x="80" y="230.532" font-size="11" font-family="Libertinus Serif" textLength="325.05" lengthAdjust="spacingAndGlyphs">IPC. Packar en katalog i full fart på alla kärnor och plockar ut en enskild </text><text x="80" y="244.59" font-size="11" font-family="Libertinus Serif" textLength="316.217" lengthAdjust="spacingAndGlyphs">fil utan att packa upp resten; indexet går att fråga direkt från DuckDB, </text><text x="80" y="258.648" font-size="11" font-family="Libertinus Serif" textLength="106.656" lengthAdjust="spacingAndGlyphs">Polars eller DataFusion.</text><text x="80" y="278.536" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="278.536" font-size="11" font-family="Libertinus Serif" textLength="266.123" lengthAdjust="spacingAndGlyphs"> — Git-server i Rust på Apache Arrow. Två motorer: znippy </text><text x="80" y="292.594" font-size="11" font-family="Libertinus Serif" textLength="324.192" lengthAdjust="spacingAndGlyphs">(Arrow IPC på en maskin, eller ett fullt Apache Iceberg-kluster) eller gix </text><text x="80" y="306.652" font-size="11" font-family="Libertinus Serif" textLength="314.193" lengthAdjust="spacingAndGlyphs">på ett vanligt filsystem. Inbyggd geo-replikering till en twin; gratis att </text><text x="80" y="320.71" font-size="11" font-family="Libertinus Serif" textLength="165.704" lengthAdjust="spacingAndGlyphs">hosta själv, eller hostad på gunnar.rs.</text><text x="80" y="340.598" font-size="11" font-family="Libertinus Serif" textLength="28.556" lengthAdjust="spacingAndGlyphs">skade</text><text x="108.556" y="340.598" font-size="11" font-family="Libertinus Serif" textLength="302.918" lengthAdjust="spacingAndGlyphs"> — Apache Iceberg i ren Rust. Katalogen vilar på ett statiskt sökträd </text><text x="80" y="354.656" font-size="11" font-family="Libertinus Serif" textLength="299.53" lengthAdjust="spacingAndGlyphs">med uppslag på nanosekunder och bäddas in in-process som en fil; </text><text x="80" y="368.714" font-size="11" font-family="Libertinus Serif" textLength="308.495" lengthAdjust="spacingAndGlyphs">katalogläsningar uppmätta till 492× Nessie och 677× Polaris. SQL via </text><text x="80" y="382.772" font-size="11" font-family="Libertinus Serif" textLength="53.614" lengthAdjust="spacingAndGlyphs">DataFusion.</text><text x="80" y="402.66" font-size="11" font-family="Libertinus Serif" textLength="23.903" lengthAdjust="spacingAndGlyphs">korp</text><text x="103.903" y="402.66" font-size="11" font-family="Libertinus Serif" textLength="301.169" lengthAdjust="spacingAndGlyphs"> — en robottestbar egui-app över hela datavägen. Hugin vakar över </text><text x="80" y="416.718" font-size="11" font-family="Libertinus Serif" textLength="319.759" lengthAdjust="spacingAndGlyphs">nuet: Spark-pipelines, en live FalkorDB-graf, ingest. Munin bär minnet: </text><text x="80" y="430.776" font-size="11" font-family="Libertinus Serif" textLength="296.384" lengthAdjust="spacingAndGlyphs">Iceberg time-travel, kartor, utredningar. Levereras som en bootbar </text><text x="80" y="444.834" font-size="11" font-family="Libertinus Serif" textLength="45.254" lengthAdjust="spacingAndGlyphs">appliance.</text><text x="80" y="464.722" font-size="11" font-family="Libertinus Serif" textLength="28.776" lengthAdjust="spacingAndGlyphs">tunnr</text><text x="108.776" y="464.722" font-size="11" font-family="Libertinus Serif" textLength="284.218" lengthAdjust="spacingAndGlyphs"> — ramverk för bare-metal-appliances. Minimala, distroless OS-</text><text x="80" y="478.78" font-size="11" font-family="Libertinus Serif" textLength="303.38" lengthAdjust="spacingAndGlyphs">images där en Rust-binär kör som PID 1, network-first: WireGuard-</text><text x="80" y="492.838" font-size="11" font-family="Libertinus Serif" textLength="316.877" lengthAdjust="spacingAndGlyphs">tunneln är uppe före alla andra paket, i en VM eller på riktig hårdvara.</text><text x="24" y="521.372" font-size="11" font-family="Libertinus Serif" textLength="41.25" lengthAdjust="spacingAndGlyphs">Kontakt: </text><text x="65.25" y="521.372" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="143.907" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="205.969" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="268.031" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/skade" xlink:href="https://codeberg.org/nordisk/skade"><rect x="80" y="330.093" width="28.556" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="65.25" y="510.724" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>

43 l -0.055 -0.264 c -0.11 0.286 -0.484 0.473 -0.847 0.473 c -1.166 0 -2.563 -1.254 -2.563 -2.827 c 0 -0.44 0.242 -1.364 1.342 -1.364 c 0.385 0 0.979 0.319 1.463 1.133 l 0.022 -0.011 c -0.088 -0.275 -0.165 -0.528 -0.165 -0.693 c 0 -0.176 0.077 -0.451 0.396 -0.451 c 2.398 0 3.168 1.551 3.168 2.805 c 0 2.057 -1.705 3.619 -4.07 3.619 c -2.475 0 -4.51 -1.903 -4.51 -4.268 c 0 -2.343 1.716 -4.191 4.345 -4.191 c 1.243 0 1.903 0.385 2.563 0.891 l -0.143 0.198 c -0.594 -0.473 -1.276 -0.726 -2.211 -0.726 c -2.838 0 -3.674 2.376 -3.674 4.026 c 0 2.607 1.848 3.729 3.52 3.729 c 1.375 0 3.3 -1.089 3.3 -3.355 c 0 -1.826 -0.693 -2.343 -1.815 -2.343 c -0.022 0 -0.121 0.022 -0.121 0.132 Z m -0.154 2.662 c 0 -0.374 -0.187 -0.935 -0.33 -1.276 c -0.341 -0.803 -0.88 -1.43 -1.265 -1.43 c -0.693 0 -0.858 0.484 -0.858 1.012 c 0 0.682 0.187 1.386 0.748 1.947 c 0.33 0.341 0.803 0.44 0.99 0.44 c 0.396 0 0.715 -0.275 0.715 -0.693 Z "/></symbol></defs></g><g class="text-layer"><text x="24" y="36.9" font-size="20" font-family="Libertinus Serif" textLength="117.08" lengthAdjust="spacingAndGlyphs">Ignalina ApS</text><text x="24" y="57.995" font-size="11" font-family="Libertinus Serif" textLength="223.993" lengthAdjust="spacingAndGlyphs">"We love the smell of motherboards in the morning"</text><text x="247.993" y="57.995" font-size="11" font-family="Libertinus Serif"> </text><text x="24" y="72.053" font-size="11" font-family="Libertinus Serif" textLength="144.177" lengthAdjust="spacingAndGlyphs">— och vi gör ingenting annat än </text><text x="24" y="86.111" font-size="11" font-family="Libertinus Serif" textLength="230.681" lengthAdjust="spacingAndGlyphs">premiummjukvara. Vi är ett renodlat skandinaviskt </text><text x="24" y="100.169" font-size="11" font-family="Libertinus Serif" textLength="210.628" lengthAdjust="spacingAndGlyphs">företag. Våra applikationer levereras som open </text><text x="24" y="114.227" font-size="11" font-family="Libertinus Serif" textLength="213.697" lengthAdjust="spacingAndGlyphs">source, som SaaS och som hårdvaru-appliances.</text><text x="24" y="133.972" font-size="11" font-family="Libertinus Serif" textLength="221.375" lengthAdjust="spacingAndGlyphs">Våra SaaS-lösningar körs på finsk kärnkraft.</text><text x="24" y="164.647" font-size="15" font-family="Libertinus Serif" textLength="69.585" lengthAdjust="spacingAndGlyphs">Produkter</text><text x="80" y="182.385" font-size="11" font-family="Libertinus Serif" textLength="32.263" lengthAdjust="spacingAndGlyphs">holger</text><text x="112.263" y="182.385" font-size="11" font-family="Libertinus Serif" textLength="96.558" lengthAdjust="spacingAndGlyphs"> — immutable artifact </text><text x="80" y="196.443" font-size="11" font-family="Libertinus Serif" textLength="152.614" lengthAdjust="spacingAndGlyphs">repository i ren Rust. Speglar från </text><text x="80" y="210.501" font-size="11" font-family="Libertinus Serif" textLength="159.533" lengthAdjust="spacingAndGlyphs">internet, Nexus eller Artifactory till </text><text x="80" y="224.559" font-size="11" font-family="Libertinus Serif" textLength="155.606" lengthAdjust="spacingAndGlyphs">oföränderliga znippy-arkiv för air-</text><text x="80" y="238.617" font-size="11" font-family="Libertinus Serif" textLength="159.731" lengthAdjust="spacingAndGlyphs">gappade miljöer: content-addressed </text><text x="80" y="252.675" font-size="11" font-family="Libertinus Serif" textLength="159.962" lengthAdjust="spacingAndGlyphs">med Blake3, O(1) random access till </text><text x="80" y="266.733" font-size="11" font-family="Libertinus Serif" textLength="68.453" lengthAdjust="spacingAndGlyphs">filer, 2 MB RSS.</text><text x="80" y="286.621" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="286.621" font-size="11" font-family="Libertinus Serif" textLength="139.106" lengthAdjust="spacingAndGlyphs"> — parallellt arkiv med random </text><text x="80" y="300.679" font-size="11" font-family="Libertinus Serif" textLength="162.503" lengthAdjust="spacingAndGlyphs">access, byggt på Apache Arrow IPC. </text><text x="80" y="314.737" font-size="11" font-family="Libertinus Serif" textLength="154.319" lengthAdjust="spacingAndGlyphs">Packar en katalog i full fart på alla </text><text x="80" y="328.795" font-size="11" font-family="Libertinus Serif" textLength="158.301" lengthAdjust="spacingAndGlyphs">kärnor och plockar ut en enskild fil </text><text x="80" y="342.853" font-size="11" font-family="Libertinus Serif" textLength="170.06" lengthAdjust="spacingAndGlyphs">utan att packa upp resten; indexet går </text><text x="80" y="356.911" font-size="11" font-family="Libertinus Serif" textLength="162.151" lengthAdjust="spacingAndGlyphs">att fråga direkt från DuckDB, Polars </text><text x="80" y="370.969" font-size="11" font-family="Libertinus Serif" textLength="76.098" lengthAdjust="spacingAndGlyphs">eller DataFusion.</text><text x="80" y="390.857" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="390.857" font-size="11" font-family="Libertinus Serif" textLength="137.929" lengthAdjust="spacingAndGlyphs"> — Git-server i Rust på Apache </text><text x="80" y="404.915" font-size="11" font-family="Libertinus Serif" textLength="160.633" lengthAdjust="spacingAndGlyphs">Arrow. Två motorer: znippy (Arrow </text><text x="80" y="418.973" font-size="11" font-family="Libertinus Serif" textLength="139.579" lengthAdjust="spacingAndGlyphs">IPC på en maskin, eller ett fullt </text><text x="80" y="433.031" font-size="11" font-family="Libertinus Serif" textLength="174.779" lengthAdjust="spacingAndGlyphs">Apache Iceberg-kluster) eller gix på ett </text><text x="80" y="447.089" font-size="11" font-family="Libertinus Serif" textLength="139.018" lengthAdjust="spacingAndGlyphs">vanligt filsystem. Inbyggd geo-</text><text x="80" y="461.147" font-size="11" font-family="Libertinus Serif" textLength="174.075" lengthAdjust="spacingAndGlyphs">replikering till en twin; gratis att hosta </text><text x="80" y="475.205" font-size="11" font-family="Libertinus Serif" textLength="138.699" lengthAdjust="spacingAndGlyphs">själv, eller hostad på gunnar.rs.</text><text x="80" y="495.093" font-size="11" font-family="Libertinus Serif" textLength="28.556" lengthAdjust="spacingAndGlyphs">skade</text><text x="108.556" y="495.093" font-size="11" font-family="Libertinus Serif" textLength="131.868" lengthAdjust="spacingAndGlyphs"> — Apache Iceberg i ren Rust. </text><text x="80" y="509.151" font-size="11" font-family="Libertinus Serif" textLength="168.3" lengthAdjust="spacingAndGlyphs">Katalogen vilar på ett statiskt sökträd </text><text x="80" y="523.209" font-size="11" font-family="Libertinus Serif" textLength="155.925" lengthAdjust="spacingAndGlyphs">med uppslag på nanosekunder och </text><text x="80" y="537.267" font-size="11" font-family="Libertinus Serif" textLength="140.855" lengthAdjust="spacingAndGlyphs">bäddas in in-process som en fil; </text><text x="80" y="551.325" font-size="11" font-family="Libertinus Serif" textLength="159.72" lengthAdjust="spacingAndGlyphs">katalogläsningar uppmätta till 492× </text><text x="80" y="565.383" font-size="11" font-family="Libertinus Serif" textLength="146.025" lengthAdjust="spacingAndGlyphs">Nessie och 677× Polaris. SQL via </text><text x="80" y="579.441" font-size="11" font-family="Libertinus Serif" textLength="53.614" lengthAdjust="spacingAndGlyphs">DataFusion.</text><text x="80" y="599.329" font-size="11" font-family="Libertinus Serif" textLength="23.903" lengthAdjust="spacingAndGlyphs">korp</text><text x="103.903" y="599.329" font-size="11" font-family="Libertinus Serif" textLength="146.85" lengthAdjust="spacingAndGlyphs"> — en robottestbar egui-app över </text><text x="80" y="613.387" font-size="11" font-family="Libertinus Serif" textLength="151.569" lengthAdjust="spacingAndGlyphs">hela datavägen. Hugin vakar över </text><text x="80" y="627.445" font-size="11" font-family="Libertinus Serif" textLength="130.482" lengthAdjust="spacingAndGlyphs">nuet: Spark-pipelines, en live </text><text x="80" y="641.503" font-size="11" font-family="Libertinus Serif" textLength="149.193" lengthAdjust="spacingAndGlyphs">FalkorDB-graf, ingest. Munin bär </text><text x="80" y="655.561" font-size="11" font-family="Libertinus Serif" textLength="157.399" lengthAdjust="spacingAndGlyphs">minnet: Iceberg time-travel, kartor, </text><text x="80" y="669.619" font-size="11" font-family="Libertinus Serif" textLength="173.569" lengthAdjust="spacingAndGlyphs">utredningar. Levereras som en bootbar </text><text x="80" y="683.677" font-size="11" font-family="Libertinus Serif" textLength="45.254" lengthAdjust="spacingAndGlyphs">appliance.</text><text x="80" y="703.565" font-size="11" font-family="Libertinus Serif" textLength="28.776" lengthAdjust="spacingAndGlyphs">tunnr</text><text x="108.776" y="703.565" font-size="11" font-family="Libertinus Serif" textLength="122.056" lengthAdjust="spacingAndGlyphs"> — ramverk för bare-metal-</text><text x="80" y="717.623" font-size="11" font-family="Libertinus Serif" textLength="162.162" lengthAdjust="spacingAndGlyphs">appliances. Minimala, distroless OS-</text><text x="80" y="731.681" font-size="11" font-family="Libertinus Serif" textLength="171.457" lengthAdjust="spacingAndGlyphs">images där en Rust-binär kör som PID </text><text x="80" y="745.739" font-size="11" font-family="Libertinus Serif" textLength="164.197" lengthAdjust="spacingAndGlyphs">1, network-first: WireGuard-tunneln </text><text x="80" y="759.797" font-size="11" font-family="Libertinus Serif" textLength="170.423" lengthAdjust="spacingAndGlyphs">är uppe före alla andra paket, i en VM </text><text x="80" y="773.855" font-size="11" font-family="Libertinus Serif" textLength="105.93" lengthAdjust="spacingAndGlyphs">eller på riktig hårdvara.</text><text x="24" y="793.743" font-size="11" font-family="Libertinus Serif" textLength="41.25" lengthAdjust="spacingAndGlyphs">Kontakt: </text><text x="65.25" y="793.743" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="171.88" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="276.116" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="380.352" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/skade" xlink:href="https://codeberg.org/nordisk/skade"><rect x="80" y="484.588" width="28.556" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="65.25" y="783.095" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>
