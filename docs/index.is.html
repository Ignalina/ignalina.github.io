bol></defs></g><g class="text-layer"><text x="24" y="36.9" font-size="20" font-family="Libertinus Serif" textLength="117.08" lengthAdjust="spacingAndGlyphs">Ignalina ApS</text><text x="24" y="58.138" font-size="11" font-family="Libertinus Serif" textLength="223.993" lengthAdjust="spacingAndGlyphs">"We love the smell of motherboards in the morning"</text><text x="247.993" y="58.138" font-size="11" font-family="Libertinus Serif" textLength="131.802" lengthAdjust="spacingAndGlyphs"> — og við gerum ekkert nema </text><text x="24" y="72.196" font-size="11" font-family="Libertinus Serif" textLength="387.618" lengthAdjust="spacingAndGlyphs">premium-hugbúnað. Við erum hreinræktað skandinavískt fyrirtæki. Forritin okkar eru </text><text x="24" y="86.254" font-size="11" font-family="Libertinus Serif" textLength="285.406" lengthAdjust="spacingAndGlyphs">afhent sem open source, sem SaaS og sem hardware-appliances.</text><text x="24" y="105.999" font-size="11" font-family="Libertinus Serif" textLength="250.536" lengthAdjust="spacingAndGlyphs">SaaS-lausnirnar okkar keyra á finnskri kjarnorku.</text><text x="24" y="136.674" font-size="15" font-family="Libertinus Serif" textLength="40.575" lengthAdjust="spacingAndGlyphs">Vörur</text><text x="80" y="154.412" font-size="11" font-family="Libertinus Serif" textLength="32.263" lengthAdjust="spacingAndGlyphs">holger</text><text x="112.263" y="154.412" font-size="11" font-family="Libertinus Serif" textLength="260.7" lengthAdjust="spacingAndGlyphs"> — immutable artifact repository í hreinu Rust. Speglar frá </text><text x="80" y="168.47" font-size="11" font-family="Libertinus Serif" textLength="333.113" lengthAdjust="spacingAndGlyphs">internetinu, Nexus eða Artifactory yfir í óbreytanleg znippy-söfn fyrir air-</text><text x="80" y="182.528" font-size="11" font-family="Libertinus Serif" textLength="324.181" lengthAdjust="spacingAndGlyphs">gapped umhverfi: content-addressed með Blake3, O(1) random access að </text><text x="80" y="196.586" font-size="11" font-family="Libertinus Serif" textLength="78.76" lengthAdjust="spacingAndGlyphs">skrám, 2 MB RSS.</text><text x="80" y="216.474" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="216.474" font-size="11" font-family="Libertinus Serif" textLength="294.162" lengthAdjust="spacingAndGlyphs"> — samhliða safn með random access, byggt á Apache Arrow IPC. </text><text x="80" y="230.532" font-size="11" font-family="Libertinus Serif" textLength="325.897" lengthAdjust="spacingAndGlyphs">Pakkar möppu á fullum hraða allra kjarna og sækir staka skrá án þess að </text><text x="80" y="244.59" font-size="11" font-family="Libertinus Serif" textLength="312.532" lengthAdjust="spacingAndGlyphs">afpakka restina; hægt er að spyrja vísinn beint úr DuckDB, Polars eða </text><text x="80" y="258.648" font-size="11" font-family="Libertinus Serif" textLength="53.614" lengthAdjust="spacingAndGlyphs">DataFusion.</text><text x="80" y="278.536" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="278.536" font-size="11" font-family="Libertinus Serif" textLength="286.495" lengthAdjust="spacingAndGlyphs"> — Git-þjónn í Rust á Apache Arrow. Tvær vélar: znippy (Arrow </text><text x="80" y="292.594" font-size="11" font-family="Libertinus Serif" textLength="298.155" lengthAdjust="spacingAndGlyphs">IPC á einni vél, eða heill Apache Iceberg-klasi) eða gix á venjulegu </text><text x="80" y="306.652" font-size="11" font-family="Libertinus Serif" textLength="326.777" lengthAdjust="spacingAndGlyphs">skráakerfi. Innbyggð geo-replication til twin; ókeypis að hýsa sjálfur, eða </text><text x="80" y="320.71" font-size="11" font-family="Libertinus Serif" textLength="74.833" lengthAdjust="spacingAndGlyphs">hýst á gunnar.rs.</text><text x="80" y="340.598" font-size="11" font-family="Libertinus Serif" textLength="28.556" lengthAdjust="spacingAndGlyphs">skade</text><text x="108.556" y="340.598" font-size="11" font-family="Libertinus Serif" textLength="292.127" lengthAdjust="spacingAndGlyphs"> — Apache Iceberg í hreinu Rust. Katalogurinn hvílir á kyrrstæðu </text><text x="80" y="354.656" font-size="11" font-family="Libertinus Serif" textLength="328.68" lengthAdjust="spacingAndGlyphs">leitartré með uppflettingum á nanósekúndum og er felldur inn in-process </text><text x="80" y="368.714" font-size="11" font-family="Libertinus Serif" textLength="330.33" lengthAdjust="spacingAndGlyphs">sem ein skrá; lestur úr katalog mældur 492× Nessie og 677× Polaris. SQL í </text><text x="80" y="382.772" font-size="11" font-family="Libertinus Serif" textLength="92.774" lengthAdjust="spacingAndGlyphs">gegnum DataFusion.</text><text x="80" y="402.66" font-size="11" font-family="Libertinus Serif" textLength="23.903" lengthAdjust="spacingAndGlyphs">korp</text><text x="103.903" y="402.66" font-size="11" font-family="Libertinus Serif" textLength="309.331" lengthAdjust="spacingAndGlyphs"> — eitt egui-forrit, prófanlegt með vélmennum, yfir alla gagnaleiðina. </text><text x="80" y="416.718" font-size="11" font-family="Libertinus Serif" textLength="313.5" lengthAdjust="spacingAndGlyphs">Hugin vakir yfir núinu: Spark-pipelines, lifandi FalkorDB-graf, ingest. </text><text x="80" y="430.776" font-size="11" font-family="Libertinus Serif" textLength="324.258" lengthAdjust="spacingAndGlyphs">Munin geymir minnið: Iceberg time-travel, kort, rannsóknir. Afhent sem </text><text x="80" y="444.834" font-size="11" font-family="Libertinus Serif" textLength="91.729" lengthAdjust="spacingAndGlyphs">ræsanlegt appliance.</text><text x="80" y="464.722" font-size="11" font-family="Libertinus Serif" textLength="28.776" lengthAdjust="spacingAndGlyphs">tunnr</text><text x="108.776" y="464.722" font-size="11" font-family="Libertinus Serif" textLength="283.162" lengthAdjust="spacingAndGlyphs"> — rammi fyrir bare-metal appliances. Lágmarks, distroless OS-</text><text x="80" y="478.78" font-size="11" font-family="Libertinus Serif" textLength="321.871" lengthAdjust="spacingAndGlyphs">images þar sem Rust-forrit keyrir sem PID 1, network-first: WireGuard-</text><text x="80" y="492.838" font-size="11" font-family="Libertinus Serif" textLength="292.391" lengthAdjust="spacingAndGlyphs">göngin eru uppi á undan öllum öðrum pökkum, í sýndarvél eða á </text><text x="80" y="506.896" font-size="11" font-family="Libertinus Serif" textLength="118.041" lengthAdjust="spacingAndGlyphs">raunverulegum vélbúnaði.</text><text x="24" y="526.784" font-size="11" font-family="Libertinus Serif" textLength="75.735" lengthAdjust="spacingAndGlyphs">Hafðu samband: </text><text x="99.735" y="526.784" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="143.907" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="205.969" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="268.031" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/skade" xlink:href="https://codeberg.org/nordisk/skade"><rect x="80" y="330.093" width="28.556" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="99.735" y="516.136" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>

1.166 0 -2.563 -1.254 -2.563 -2.827 c 0 -0.44 0.242 -1.364 1.342 -1.364 c 0.385 0 0.979 0.319 1.463 1.133 l 0.022 -0.011 c -0.088 -0.275 -0.165 -0.528 -0.165 -0.693 c 0 -0.176 0.077 -0.451 0.396 -0.451 c 2.398 0 3.168 1.551 3.168 2.805 c 0 2.057 -1.705 3.619 -4.07 3.619 c -2.475 0 -4.51 -1.903 -4.51 -4.268 c 0 -2.343 1.716 -4.191 4.345 -4.191 c 1.243 0 1.903 0.385 2.563 0.891 l -0.143 0.198 c -0.594 -0.473 -1.276 -0.726 -2.211 -0.726 c -2.838 0 -3.674 2.376 -3.674 4.026 c 0 2.607 1.848 3.729 3.52 3.729 c 1.375 0 3.3 -1.089 3.3 -3.355 c 0 -1.826 -0.693 -2.343 -1.815 -2.343 c -0.022 0 -0.121 0.022 -0.121 0.132 Z m -0.154 2.662 c 0 -0.374 -0.187 -0.935 -0.33 -1.276 c -0.341 -0.803 -0.88 -1.43 -1.265 -1.43 c -0.693 0 -0.858 0.484 -0.858 1.012 c 0 0.682 0.187 1.386 0.748 1.947 c 0.33 0.341 0.803 0.44 0.99 0.44 c 0.396 0 0.715 -0.275 0.715 -0.693 Z "/></symbol></defs></g><g class="text-layer"><text x="24" y="36.9" font-size="20" font-family="Libertinus Serif" textLength="117.08" lengthAdjust="spacingAndGlyphs">Ignalina ApS</text><text x="24" y="57.995" font-size="11" font-family="Libertinus Serif" textLength="223.993" lengthAdjust="spacingAndGlyphs">"We love the smell of motherboards in the morning"</text><text x="247.993" y="57.995" font-size="11" font-family="Libertinus Serif"> </text><text x="24" y="72.053" font-size="11" font-family="Libertinus Serif" textLength="223.63" lengthAdjust="spacingAndGlyphs">— og við gerum ekkert nema premium-hugbúnað. </text><text x="24" y="86.111" font-size="11" font-family="Libertinus Serif" textLength="209.55" lengthAdjust="spacingAndGlyphs">Við erum hreinræktað skandinavískt fyrirtæki. </text><text x="24" y="100.169" font-size="11" font-family="Libertinus Serif" textLength="212.179" lengthAdjust="spacingAndGlyphs">Forritin okkar eru afhent sem open source, sem </text><text x="24" y="114.227" font-size="11" font-family="Libertinus Serif" textLength="153.967" lengthAdjust="spacingAndGlyphs">SaaS og sem hardware-appliances.</text><text x="24" y="133.972" font-size="11" font-family="Libertinus Serif" textLength="193.787" lengthAdjust="spacingAndGlyphs">SaaS-lausnirnar okkar keyra á finnskri </text><text x="24" y="147.887" font-size="11" font-family="Libertinus Serif" textLength="53.999" lengthAdjust="spacingAndGlyphs">kjarnorku.</text><text x="24" y="178.562" font-size="15" font-family="Libertinus Serif" textLength="40.575" lengthAdjust="spacingAndGlyphs">Vörur</text><text x="80" y="196.3" font-size="11" font-family="Libertinus Serif" textLength="32.263" lengthAdjust="spacingAndGlyphs">holger</text><text x="112.263" y="196.3" font-size="11" font-family="Libertinus Serif" textLength="96.558" lengthAdjust="spacingAndGlyphs"> — immutable artifact </text><text x="80" y="210.358" font-size="11" font-family="Libertinus Serif" textLength="161.392" lengthAdjust="spacingAndGlyphs">repository í hreinu Rust. Speglar frá </text><text x="80" y="224.416" font-size="11" font-family="Libertinus Serif" textLength="173.525" lengthAdjust="spacingAndGlyphs">internetinu, Nexus eða Artifactory yfir </text><text x="80" y="238.474" font-size="11" font-family="Libertinus Serif" textLength="156.838" lengthAdjust="spacingAndGlyphs">í óbreytanleg znippy-söfn fyrir air-</text><text x="80" y="252.532" font-size="11" font-family="Libertinus Serif" textLength="163.658" lengthAdjust="spacingAndGlyphs">gapped umhverfi: content-addressed </text><text x="80" y="266.59" font-size="11" font-family="Libertinus Serif" textLength="157.773" lengthAdjust="spacingAndGlyphs">með Blake3, O(1) random access að </text><text x="80" y="280.648" font-size="11" font-family="Libertinus Serif" textLength="78.76" lengthAdjust="spacingAndGlyphs">skrám, 2 MB RSS.</text><text x="80" y="300.536" font-size="11" font-family="Libertinus Serif" textLength="34.133" lengthAdjust="spacingAndGlyphs">znippy</text><text x="114.133" y="300.536" font-size="11" font-family="Libertinus Serif" textLength="134.618" lengthAdjust="spacingAndGlyphs"> — samhliða safn með random </text><text x="80" y="314.594" font-size="11" font-family="Libertinus Serif" textLength="156.794" lengthAdjust="spacingAndGlyphs">access, byggt á Apache Arrow IPC. </text><text x="80" y="328.652" font-size="11" font-family="Libertinus Serif" textLength="156.585" lengthAdjust="spacingAndGlyphs">Pakkar möppu á fullum hraða allra </text><text x="80" y="342.71" font-size="11" font-family="Libertinus Serif" textLength="166.562" lengthAdjust="spacingAndGlyphs">kjarna og sækir staka skrá án þess að </text><text x="80" y="356.768" font-size="11" font-family="Libertinus Serif" textLength="151.998" lengthAdjust="spacingAndGlyphs">afpakka restina; hægt er að spyrja </text><text x="80" y="370.826" font-size="11" font-family="Libertinus Serif" textLength="157.784" lengthAdjust="spacingAndGlyphs">vísinn beint úr DuckDB, Polars eða </text><text x="80" y="384.884" font-size="11" font-family="Libertinus Serif" textLength="53.614" lengthAdjust="spacingAndGlyphs">DataFusion.</text><text x="80" y="404.772" font-size="11" font-family="Libertinus Serif" textLength="36.135" lengthAdjust="spacingAndGlyphs">gunnar</text><text x="116.135" y="404.772" font-size="11" font-family="Libertinus Serif" textLength="130.35" lengthAdjust="spacingAndGlyphs"> — Git-þjónn í Rust á Apache </text><text x="80" y="418.83" font-size="11" font-family="Libertinus Serif" textLength="172.469" lengthAdjust="spacingAndGlyphs">Arrow. Tvær vélar: znippy (Arrow IPC </text><text x="80" y="432.888" font-size="11" font-family="Libertinus Serif" textLength="165.528" lengthAdjust="spacingAndGlyphs">á einni vél, eða heill Apache Iceberg-</text><text x="80" y="446.946" font-size="11" font-family="Libertinus Serif" textLength="163.592" lengthAdjust="spacingAndGlyphs">klasi) eða gix á venjulegu skráakerfi. </text><text x="80" y="461.004" font-size="11" font-family="Libertinus Serif" textLength="151.437" lengthAdjust="spacingAndGlyphs">Innbyggð geo-replication til twin; </text><text x="80" y="475.062" font-size="11" font-family="Libertinus Serif" textLength="152.427" lengthAdjust="spacingAndGlyphs">ókeypis að hýsa sjálfur, eða hýst á </text><text x="80" y="489.12" font-size="11" font-family="Libertinus Serif" textLength="44.957" lengthAdjust="spacingAndGlyphs">gunnar.rs.</text><text x="80" y="509.008" font-size="11" font-family="Libertinus Serif" textLength="28.556" lengthAdjust="spacingAndGlyphs">skade</text><text x="108.556" y="509.008" font-size="11" font-family="Libertinus Serif" textLength="146.608" lengthAdjust="spacingAndGlyphs"> — Apache Iceberg í hreinu Rust. </text><text x="80" y="523.066" font-size="11" font-family="Libertinus Serif" textLength="142.769" lengthAdjust="spacingAndGlyphs">Katalogurinn hvílir á kyrrstæðu </text><text x="80" y="537.124" font-size="11" font-family="Libertinus Serif" textLength="132.154" lengthAdjust="spacingAndGlyphs">leitartré með uppflettingum á </text><text x="80" y="551.182" font-size="11" font-family="Libertinus Serif" textLength="160.237" lengthAdjust="spacingAndGlyphs">nanósekúndum og er felldur inn in-</text><text x="80" y="565.24" font-size="11" font-family="Libertinus Serif" textLength="171.996" lengthAdjust="spacingAndGlyphs">process sem ein skrá; lestur úr katalog </text><text x="80" y="579.298" font-size="11" font-family="Libertinus Serif" textLength="164.527" lengthAdjust="spacingAndGlyphs">mældur 492× Nessie og 677× Polaris. </text><text x="80" y="593.356" font-size="11" font-family="Libertinus Serif" textLength="120.12" lengthAdjust="spacingAndGlyphs">SQL í gegnum DataFusion.</text><text x="80" y="613.244" font-size="11" font-family="Libertinus Serif" textLength="23.903" lengthAdjust="spacingAndGlyphs">korp</text><text x="103.903" y="613.244" font-size="11" font-family="Libertinus Serif" textLength="151.228" lengthAdjust="spacingAndGlyphs"> — eitt egui-forrit, prófanlegt með </text><text x="80" y="627.302" font-size="11" font-family="Libertinus Serif" textLength="155.353" lengthAdjust="spacingAndGlyphs">vélmennum, yfir alla gagnaleiðina. </text><text x="80" y="641.36" font-size="11" font-family="Libertinus Serif" textLength="137.126" lengthAdjust="spacingAndGlyphs">Hugin vakir yfir núinu: Spark-</text><text x="80" y="655.418" font-size="11" font-family="Libertinus Serif" textLength="144.078" lengthAdjust="spacingAndGlyphs">pipelines, lifandi FalkorDB-graf, </text><text x="80" y="669.476" font-size="11" font-family="Libertinus Serif" textLength="169.741" lengthAdjust="spacingAndGlyphs">ingest. Munin geymir minnið: Iceberg </text><text x="80" y="683.534" font-size="11" font-family="Libertinus Serif" textLength="163.416" lengthAdjust="spacingAndGlyphs">time-travel, kort, rannsóknir. Afhent </text><text x="80" y="697.592" font-size="11" font-family="Libertinus Serif" textLength="112.376" lengthAdjust="spacingAndGlyphs">sem ræsanlegt appliance.</text><text x="80" y="717.48" font-size="11" font-family="Libertinus Serif" textLength="28.776" lengthAdjust="spacingAndGlyphs">tunnr</text><text x="108.776" y="717.48" font-size="11" font-family="Libertinus Serif" textLength="116.985" lengthAdjust="spacingAndGlyphs"> — rammi fyrir bare-metal </text><text x="80" y="731.538" font-size="11" font-family="Libertinus Serif" textLength="163.427" lengthAdjust="spacingAndGlyphs">appliances. Lágmarks, distroless OS-</text><text x="80" y="745.596" font-size="11" font-family="Libertinus Serif" textLength="170.269" lengthAdjust="spacingAndGlyphs">images þar sem Rust-forrit keyrir sem </text><text x="80" y="759.654" font-size="11" font-family="Libertinus Serif" textLength="148.852" lengthAdjust="spacingAndGlyphs">PID 1, network-first: WireGuard-</text><text x="80" y="773.712" font-size="11" font-family="Libertinus Serif" textLength="171.82" lengthAdjust="spacingAndGlyphs">göngin eru uppi á undan öllum öðrum </text><text x="80" y="787.77" font-size="11" font-family="Libertinus Serif" textLength="117.821" lengthAdjust="spacingAndGlyphs">pökkum, í sýndarvél eða á </text><text x="80" y="801.828" font-size="11" font-family="Libertinus Serif" textLength="118.041" lengthAdjust="spacingAndGlyphs">raunverulegum vélbúnaði.</text><text x="24" y="821.716" font-size="11" font-family="Libertinus Serif" textLength="75.735" lengthAdjust="spacingAndGlyphs">Hafðu samband: </text><text x="99.735" y="821.716" font-size="11" font-family="Libertinus Serif" textLength="91.817" lengthAdjust="spacingAndGlyphs">rickard@ignalina.dk</text></g><g class="link-layer" aria-hidden="true"><a href="https://codeberg.org/nordisk/holger" xlink:href="https://codeberg.org/nordisk/holger"><rect x="80" y="185.795" width="32.263" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/znippy" xlink:href="https://codeberg.org/nordisk/znippy"><rect x="80" y="290.031" width="34.133" height="13.915" fill="transparent" stroke="none"/></a><a href="https://gunnar.rs" xlink:href="https://gunnar.rs"><rect x="80" y="394.267" width="36.135" height="13.915" fill="transparent" stroke="none"/></a><a href="https://codeberg.org/nordisk/skade" xlink:href="https://codeberg.org/nordisk/skade"><rect x="80" y="498.503" width="28.556" height="13.915" fill="transparent" stroke="none"/></a><a href="mailto:rickard@ignalina.dk" xlink:href="mailto:rickard@ignalina.dk"><rect x="99.735" y="811.068" width="91.817" height="14.058" fill="transparent" stroke="none"/></a></g></svg>
